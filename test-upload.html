<!DOCTYPE html>
<html>
<head>
  <title>Test Upload R2</title>
</head>
<body>
  <h2>Test Upload ke R2</h2>
  <button onclick="testUpload()">Klik buat Test</button>
  <pre id="result" style="background:#eee; padding:10px; margin-top:10px;"></pre>

  <script>
    async function testUpload() {
      const resultBox = document.getElementById("result");
      resultBox.textContent = "Uploading...";

      const testFile = new Blob(["hello test dari PAM"], { type: "text/plain" });

      try {
        const res = await fetch("/api/upload-to-r2", {
          method: "POST",
          headers: {
            "x-file-name": "test.txt",
            "Content-Type": "text/plain",
          },
          body: testFile,
        });
        const data = await res.json();
        resultBox.textContent = JSON.stringify(data, null, 2);
      } catch (err) {
        resultBox.textContent = "ERROR: " + err.message;
      }
    }
  </script>
</body>
</html>
